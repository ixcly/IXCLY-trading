<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IXCLY PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080b1a;--c:#10152b;--c2:#182040;--ln:#252f58;--t:#eaf0ff;--m:#8190b8;--up:#2de2c6;--dn:#ff5c8a;--ac:#7b6cff;--y:#ffc46b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(700px 380px at 90% -8%,#2a1f6e 0,transparent 62%),radial-gradient(500px 300px at -10% 30%,#0b3a55 0,transparent 60%),var(--bg);color:var(--t);font:14px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
h1{font:800 22px/1 "Trebuchet MS",sans-serif;letter-spacing:.5px}h1 span{background:linear-gradient(90deg,var(--up),var(--ac));-webkit-background-clip:text;color:transparent}
h2{font-size:15px;margin:18px 0 8px}small,.m{color:var(--m);font-size:12px}
.card{background:linear-gradient(160deg,var(--c),#0d1226);border:1px solid var(--ln);border-radius:16px;padding:13px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.num{font-family:ui-monospace,Menlo,monospace}
.btn{border:0;border-radius:12px;padding:11px 14px;font:700 13px "Trebuchet MS",sans-serif;color:#061018;background:linear-gradient(90deg,var(--up),#5ad0ff);width:100%}
.btn.s{background:var(--c2);color:var(--t);border:1px solid var(--ln)}.btn.d{background:rgba(255,92,138,.16);color:var(--dn);border:1px solid #5a2440}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--c2);border:1px solid var(--ln);color:var(--m);font-size:13px}
.chip.on{color:#061018;background:var(--up);border-color:var(--up);font-weight:700}
input{width:100%;background:var(--c2);border:1px solid var(--ln);color:var(--t);border-radius:12px;padding:11px;font-size:15px;outline:0}input:focus{border-color:var(--ac)}
.bar{height:8px;border-radius:9px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--up))}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}.tag.L{background:rgba(45,226,198,.15);color:var(--up)}.tag.S{background:rgba(255,92,138,.15);color:var(--dn)}
.lv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ln)}.lv:last-child{border:0}
.sw{width:46px;height:26px;border-radius:99px;background:var(--c2);border:1px solid var(--ln);position:relative;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--m);transition:.2s}
.sw.on{background:rgba(45,226,198,.25)}.sw.on:after{left:22px;background:var(--up)}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(8,11,26,.94);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tb b{flex:1;text-align:center;font-size:10.5px;color:var(--m);padding:5px 0;font-weight:600}.tb b span{display:block;font-size:19px}.tb b.on{color:var(--up)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--c2);border:1px solid var(--ac);padding:9px 16px;border-radius:12px;transition:.25s;z-index:9}#toast.on{transform:translate(-50%,0)}
.ld{display:grid;place-items:center;height:50vh}.ld i{width:34px;height:34px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--up);animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
img.ch{width:100%;border-radius:12px;display:block}.lst{cursor:pointer}
@media(prefers-reduced-motion:reduce){.ld i{animation:none}}
</style></head><body>
<div id="toast"></div><div id="v"><div class="ld"><i></i></div></div>
<div class="tb"><b data-t="home" class="on" onclick="tab('home')"><span>🏠</span>Главная</b><b data-t="signals" onclick="tab('signals')"><span>🔥</span>Сигналы</b><b data-t="search" onclick="tab('search')"><span>🔍</span>Анализ</b><b data-t="portfolio" onclick="tab('portfolio')"><span>💼</span>Портфель</b><b data-t="more" onclick="tab('more')"><span>⚙️</span>Ещё</b></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#080b1a');tg.setBackgroundColor('#080b1a')}catch(e){}
const $=s=>document.querySelector(s),V=()=>$('#v'),hap=()=>tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=p=>{p=+p;const a=Math.abs(p);return a>=1000?p.toLocaleString('en',{maximumFractionDigits:2}):a>=1?p.toFixed(4):a>=.01?p.toFixed(5):p.toFixed(8)};
const pc=(p,e)=>((p-e)/e*100).toFixed(1)+'%';
let S={},cur=null,stack=[],R={};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
async function api(a,p){try{const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},p,{initData:tg.initData}))});const j=await r.json();if(j.error)toast('⚠ '+j.error);return j}catch(e){toast('Нет связи с ботом');return{error:1}}}
const loading=()=>V().innerHTML='<div class="ld"><i></i></div>';
const TABOF={coin:'search',stats:'more',news:'more',settings:'more',alerts:'more'};
async function go(p,a,back){if(!back&&cur)stack.push(cur);cur=[p,a];hap();document.querySelectorAll('.tb b').forEach(b=>b.classList.toggle('on',b.dataset.t===(TABOF[p]||p)));stack.length?tg.BackButton.show():tg.BackButton.hide();scrollTo(0,0);loading();await P[p](a)}
function tab(t){stack=[];cur=null;go(t)}
tg.BackButton.onClick(()=>{const p=stack.pop();if(p)go(p[0],p[1],true)});
const sw=(on,fn)=>`<div class="sw ${on?'on':''}" onclick="${fn}"></div>`;
const side=s=>`<span class="tag ${s=='LONG'?'L':'S'}">${s}</span>`;
const TI={'Краткосрочный':'⚡','Среднесрочный':'⏳','Долгосрочный':'🛡'};
const sigRow=x=>`<div class="card lst" onclick="go('coin','${x.coin}')"><div class="row"><b>${x.coin} ${side(x.side)}</b><span class="m">${TI[x.type]||''} ${x.type||''}</span></div><div class="row" style="margin-top:8px"><div class="bar" style="flex:1"><i style="width:${x.strength||0}%"></i></div><b class="num">${x.strength||0}%</b></div>${x.entry?`<small class="num">Вход ${f(x.entry)} · TP1 ${f(x.tp1)} · SL ${f(x.sl1)}</small>`:''}</div>`;
const P={};
P.home=async()=>{S=await api('me');if(S.error)return;const c=S.ctx||{},n=S.news||{},b=n.bias;
V().innerHTML=`<div class="row"><h1>IXCLY <span>PRO</span></h1><small>v${S.version}</small></div><small>Привет, ${esc(S.name)} 👋</small>
<div class="g"><div class="card"><small>BTC тренд</small><h2 style="margin:4px 0 0">${esc(c.btc_txt)}</h2></div><div class="card"><small>Fear & Greed</small><h2 style="margin:4px 0 0">${c.fng==null?'—':c.fng} <small>${esc(c.fng_txt)}</small></h2></div></div>
<div class="card lst" onclick="go('news')"><div class="row"><small>📰 Новостной фон</small><b class="${b>0?'up':b<0?'dn':''}">${b>0?'Бычий':b<0?'Медвежий':'Нейтральный'}</b></div><div style="margin:6px 0 2px"><b>${esc(n.title_ru||'Нет данных')}</b></div><small>${esc((n.impact||'').slice(0,160))}</small></div>
<h2>🧐 Движение за 24ч</h2><div id="mv" class="m">загрузка…</div>
<h2>Быстрый доступ</h2><div class="g"><button class="btn s" onclick="go('stats')">📊 Статистика</button><button class="btn s" onclick="go('news')">📰 Новости</button><button class="btn s" onclick="go('alerts')">🔔 Алерты</button><button class="btn s" onclick="go('settings')">⚙️ Уведомления</button></div>`;
const m=await api('movers');if(!m.up)return;$('#mv').innerHTML=`<div class="g"><div class="card">${m.up.map(x=>`<div class="lv lst" onclick="go('coin','${x[0]}')"><b>${x[0]}</b><span class="up num">+${x[1].toFixed(1)}%</span></div>`).join('')}</div><div class="card">${m.down.map(x=>`<div class="lv lst" onclick="go('coin','${x[0]}')"><b>${x[0]}</b><span class="dn num">${x[1].toFixed(1)}%</span></div>`).join('')}</div></div>`};
let SF='Все';
P.signals=async(flt)=>{if(flt)SF=flt;const j=await api('signals',{flt:SF});if(j.error)return;
const F=[['Все','📋 Все'],['Краткосрочный','⚡ Кратко'],['Среднесрочный','⏳ Средне'],['Долгосрочный','🛡 Долго'],['mode:aggressive','🟢 Агрессивный'],['mode:balanced','🟡 Баланс'],['mode:conservative','🔴 Консерв.']];
V().innerHTML=`<h1>Актуальные <span>сигналы</span></h1><div class="chips">${F.map(x=>`<div class="chip ${SF==x[0]?'on':''}" onclick="P.signals('${x[0]}')">${x[1]}</div>`).join('')}</div>`+(j.items.length?j.items.map(sigRow).join(''):'<div class="card m">Сейчас в этой категории сигналов нет. Сканер проверяет рынок каждые 20 минут, новые придут в чат.</div>')};
P.search=async()=>{if(!S.coins)S=await api('me');
V().innerHTML=`<h1>Анализ <span>монеты</span></h1><div class="row" style="margin:10px 0"><input id="q" placeholder="Тикер, например SOL" autocapitalize="characters" onkeydown="if(event.key=='Enter')sq()"><button class="btn" style="width:90px" onclick="sq()">Найти</button></div><div class="chips" style="flex-wrap:wrap;overflow:visible">${(S.coins||[]).slice(0,60).map(c=>`<div class="chip" onclick="go('coin','${c}')">${c}</div>`).join('')}</div>`};
const sq=()=>{const v=$('#q').value.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,'');if(v)go('coin',v)};
P.coin=async(c,force)=>{const r=await api('analyze',{coin:c,force:!!force});if(r.error){V().innerHTML=`<div class="card">${esc(r.error)}</div>`;return}R=r;
if(r.price_only){V().innerHTML=`<h1>${c}</h1><div class="card">💰 Цена: <b class="num">${f(r.price)}</b><br><small>Свечи недоступны, анализ невозможен.</small></div>`;return}
const L=r.is_long,v=r.verdict=='ENTER';
V().innerHTML=`<div class="row"><h1>${c} ${side(r.side)}</h1><b class="${v?'up':'y'}" style="color:${v?'var(--up)':'var(--y)'}">${v?'✅ ВХОДИТЬ':'⏳ ЖДАТЬ'}</b></div>
${r.img?`<div class="card" style="padding:6px"><img class="ch" src="${r.img}"></div>`:''}
<div class="card"><div class="row"><small>${esc(r.type)} · ${esc(r.regime)}</small><b class="num">Conf ${r.strength}%</b></div><div class="bar" style="margin:8px 0"><i style="width:${r.strength}%"></i></div><small>📰 ${esc(r.news_status)} · 🌍 BTC ${esc(r.btc_txt)}${r.fng!=null?' · F&G '+r.fng:''}</small>${r.fake_breakout?'<br><small class="dn">⚠ Ложный пробой (тонкий объём)</small>':''}${r.corr?`<br><small class="dn">⚠ ${esc(r.corr)}</small>`:''}</div>
<div class="card"><div class="lv"><span>📥 Вход (только лимит)</span><b class="num">${f(r.entry)}</b></div><div class="lv"><span>💰 Сейчас</span><b class="num">${f(r.price)}</b></div>
${r.tps.map((p,i)=>`<div class="lv"><span>🎯 TP${i+1}</span><b class="num up">${f(p)} <small>${pc(p,r.entry)}</small></b></div>`).join('')}${r.sls.map((p,i)=>`<div class="lv"><span>🛡 SL${i+1}</span><b class="num dn">${f(p)} <small>${pc(p,r.entry)}</small></b></div>`).join('')}</div>
<div class="card"><small>⚖ ${esc(r.leverage)}</small><div class="lv"><span>Размер позиции</span><b class="num">$${r.pos_usdt.toFixed(0)}</b></div><div class="lv"><span>Риск на сделку</span><b class="num">$${r.risk_usdt.toFixed(0)}</b></div><div class="lv"><span>Ликвидация при x20</span><b class="num dn">${f(r.liq_x20)}</b></div>${r.bt?`<small>🧪 Бэктест ${r.bt.days} дн.: ${r.bt.trades} сд · TP1 ${r.bt.winrate}% · ${r.bt.avg_r}R · PF ${r.bt.pf}</small>`:''}</div>
${r.comment?`<div class="card">💬 <b>Аналитик (${esc(r.risk_lvl)} риск)</b><br><small>${esc(r.comment)}</small></div>`:''}
${r.reasons&&r.reasons.length?`<div class="card"><b>📈 Почему</b>${r.reasons.map(x=>`<div class="m">• ${esc(x)}</div>`).join('')}${r.patterns&&r.patterns.length?`<div class="m" style="margin-top:6px">🕯 ${esc(r.patterns.join('; '))}</div>`:''}${r.notes&&r.notes.length?`<div class="m" style="margin-top:6px">⚙ ${esc(r.notes.join('; '))}</div>`:''}</div>`:''}
${r.position?`<button class="btn d" onclick="act('pos_close','${c}')">❌ Закрыл сделку</button>`:`<button class="btn" onclick="act('pos_enter','${c}')">✅ Вошёл в сделку (лимит)</button>`}
<div class="g" style="margin-top:8px"><button class="btn s" onclick="go('coin','${c}',1);P.coin('${c}',1)">🔄 Обновить</button><button class="btn s" onclick="act('fav_add','${c}')">${r.in_fav?'⭐ В избранном':'💾 В избранное'}</button></div>
<button class="btn s" style="margin-top:8px" onclick="alertFor('${c}',${r.price})">🔔 Алерт на цену</button><p class="m" style="margin:12px 0">⚠ Не финансовая рекомендация. Входите только лимитным ордером.</p>`};
async function act(a,c){hap();const j=await api(a,{coin:c});if(j.error)return;toast(j.msg||'Готово');if(a=='pos_enter'||a=='pos_close')R.position=a=='pos_enter';if(cur[0]=='coin')P.coin(c);else go(cur[0],cur[1],1)}
async function alertFor(c,p){const t=prompt('Уведомить, когда цена '+c+' достигнет (сейчас '+f(p)+'):',f(p));if(!t)return;const v=parseFloat(t.replace(',','.').replace(/\s/g,''));if(!(v>0))return toast('Введите число');const j=await api('alert_add',{coin:c,price:v,op:v>=p?'>':'<'});if(!j.error)toast(j.msg)}
P.portfolio=async()=>{const j=await api('portfolio');if(j.error)return;const s=j.risk;
V().innerHTML=`<h1>Мой <span>портфель</span></h1>
<div class="g"><div class="card"><small>💰 Депозит</small><h2 style="margin:4px 0 8px" class="num">$${s.deposit}</h2><input id="dep" type="number" inputmode="decimal" placeholder="Новый депозит"><button class="btn s" style="margin-top:6px" onclick="setv('set_deposit','dep')">Сохранить</button></div>
<div class="card"><small>📉 Риск на сделку</small><h2 style="margin:4px 0 8px" class="num">${s.risk_pct}%</h2><input id="rsk" type="number" inputmode="decimal" placeholder="0.1 – 10"><button class="btn s" style="margin-top:6px" onclick="setv('set_risk','rsk')">Сохранить</button></div></div>
<div class="card"><div class="row"><small>⚠ Открытый риск</small><b class="num">${j.open_risk.toFixed(1)}% / ${s.max_open_risk}%</b></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,j.open_risk/s.max_open_risk*100)}%"></i></div></div>
<h2>⚙️ Режим торговли</h2><div class="chips">${[['aggressive','🟢 Агрессивный 60%'],['balanced','🟡 Баланс 66%'],['conservative','🔴 Консерв. 80%']].map(x=>`<div class="chip ${j.mode==x[0]?'on':''}" onclick="mode('${x[0]}')">${x[1]}</div>`).join('')}</div>
<h2>📈 Открытые позиции</h2>${Object.keys(j.positions).length?Object.entries(j.positions).map(([c,p])=>`<div class="card"><div class="row lst" onclick="go('coin','${c}')"><b>${c} ${side(p.side)}</b><b class="num ${p.pnl>=0?'up':'dn'}">${p.waiting?'ждём вход':(p.pnl>=0?'+':'')+p.pnl.toFixed(2)+'%'}</b></div><small class="num">Вход ${f(p.entry_price)} · сейчас ${f(p.price)} · SL ${f(p.sl1)}<br>${p.hit_tp1?'✅':'⏳'}TP1 ${p.hit_tp2?'✅':'⏳'}TP2 ${p.hit_tp3?'✅':'⏳'}TP3</small><button class="btn d" style="margin-top:8px" onclick="act('pos_close','${c}')">❌ Закрыть</button></div>`).join(''):'<div class="card m">Позиций нет. Откройте анализ монеты и нажмите «Вошёл в сделку».</div>'}
<h2>⭐ Избранное</h2>${j.saved.length?j.saved.map(s=>`<div class="card row"><b class="lst" onclick="go('coin','${s.coin}')">${{in_trade:'📈',expired:'⌛'}[s.status]||'⭐'} ${s.coin}</b><button class="chip" onclick="act('fav_del','${s.coin}')">🗑</button></div>`).join(''):'<div class="card m">Пусто. Сохраняйте идеи кнопкой «В избранное».</div>'}
<h2>📜 История входов</h2>${j.history.length?j.history.slice().reverse().map(t=>`<div class="card"><div class="row"><b>${t.coin} ${side(t.side)}</b><small>${new Date(t.entered_at*1000).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><small class="num">Вход ${f(t.entry)} · TP1 ${f(t.tp1)} · SL ${f(t.sl1)}</small></div>`).join(''):'<div class="card m">Вы ещё не входили в сделки.</div>'}`};
async function setv(a,id){const v=parseFloat($('#'+id).value.replace(',','.'));if(!(v>0))return toast('Введите число');const j=await api(a,{value:v});if(!j.error){toast(j.msg);P.portfolio()}}
async function mode(m){const j=await api('set_mode',{value:m});if(!j.error){toast(j.msg);P.portfolio()}}
P.stats=async()=>{const j=await api('stats');if(j.error)return;window.ST=j;stl('active')};
const STN={active:'⏳ В работе',win:'✅ Успешные',missed:'🚫 Упущено',loss:'❌ Убыточные',expired:'⌛ По времени'};
function stl(k){const j=ST;V().innerHTML=`<h1>Статистика <span>сигналов</span></h1><div class="g"><div class="card"><small>🎯 Винрейт</small><h2 class="up num" style="margin:4px 0 0">${j.wr.toFixed(1)}%</h2></div><div class="card"><small>Средний результат</small><h2 class="num" style="margin:4px 0 0">${j.exp_r>=0?'+':''}${j.exp_r.toFixed(2)}R</h2></div></div><small>Всего уникальных: ${j.total}. Считается по свечам: вход лимиткой, TP1 = победа.</small><div class="chips" style="margin-top:8px">${Object.keys(STN).map(s=>`<div class="chip ${s==k?'on':''}" onclick="stl('${s}')">${STN[s]} ${j.counts[s]}</div>`).join('')}</div>${j.lists[k].length?j.lists[k].map(sigRow).join(''):'<div class="card m">Здесь пока пусто.</div>'}`}
P.news=async()=>{const j=await api('news');if(j.error)return;const b=j.bias;V().innerHTML=`<h1>Новости <span>рынка</span></h1><div class="card"><div class="row"><small>${esc(b.published||'')}</small><b class="${b.bias>0?'up':b.bias<0?'dn':''}">${b.bias>0?'🟢 Бычий':b.bias<0?'🔴 Медвежий':'⚪ Нейтральный'}</b></div><h2>${esc(b.title_ru)}</h2><div class="m">${esc(b.summary)}</div><p style="margin-top:8px">${esc(b.impact)}</p><small>🪙 ${esc(b.coins)}</small></div><div class="card" style="white-space:pre-line">${j.html}</div>`};
const NT=[['signals','🔥 Сигналы (сетапы)'],['news','📰 Новости'],['anomalies','🚨 Аномалии объёма'],['pos_updates','📊 Отчёты по сделкам (20 мин)'],['briefing','☀️ Утренний брифинг']];
P.settings=async()=>{const j=await api('me');if(j.error)return;S=j;const n=j.notif;V().innerHTML=`<h1>Уведомления <span>в чат</span></h1><small>Бот пришлёт их вам в Telegram. Любое действие в приложении тоже подтверждается сообщением.</small>${NT.map(x=>`<div class="card row"><span>${x[1]}</span>${sw(n[x[0]],`tgl('${x[0]}')`)}</div>`).join('')}<h2>🔗 Вебхук</h2><div class="card"><input id="wh" placeholder="https://your-server.com/api/signal" value="${esc(j.webhook)}"><button class="btn s" style="margin-top:6px" onclick="wh()">Сохранить</button></div>`};
async function tgl(k){const j=await api('toggle',{key:k});if(!j.error){toast(j.msg);P.settings()}}
async function wh(){const j=await api('webhook',{url:$('#wh').value});if(!j.error)toast(j.msg)}
P.alerts=async()=>{const j=await api('me');if(j.error)return;V().innerHTML=`<h1>Алерты <span>по цене</span></h1><div class="card"><div class="row"><input id="ac" placeholder="Тикер" style="width:42%"><input id="ap" type="number" inputmode="decimal" placeholder="Цена" style="width:58%"></div><button class="btn" style="margin-top:8px" onclick="addA()">🔔 Создать алерт</button></div>${j.alerts.length?j.alerts.map((a,i)=>`<div class="card row"><b>${a.coin} <span class="num ${a.op=='>'?'up':'dn'}">${a.op} ${f(a.price)}</span></b><button class="chip" onclick="delA(${i})">🗑</button></div>`).join(''):'<div class="card m">Алертов нет. Бот напишет в чат, когда цена достигнет уровня.</div>'}`};
async function addA(){const c=$('#ac').value.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,''),v=parseFloat($('#ap').value);if(!c||!(v>0))return toast('Укажите тикер и цену');const j=await api('alert_add',{coin:c,price:v});if(!j.error){toast(j.msg);P.alerts()}}
async function delA(i){const j=await api('alert_del',{idx:i});if(!j.error)P.alerts()}
P.more=async()=>{const M=[['stats','📊','Статистика сигналов'],['news','📰','Новости'],['alerts','🔔','Алерты по цене'],['settings','⚙️','Уведомления и вебхук']];V().innerHTML=`<h1>Ещё</h1>${M.map(x=>`<div class="card lst row" onclick="go('${x[0]}')"><span>${x[1]} ${x[2]}</span><span class="m">›</span></div>`).join('')}<div class="card lst row" onclick="csv()"><span>📥 Экспорт CSV (пришлю в чат)</span><span class="m">›</span></div><p class="m" style="margin-top:14px">IXCLY PRO · Криптовалюта — это рискованно.</p>`};
async function csv(){const j=await api('csv');if(!j.error)toast(j.msg)}
tab('home');
</script></body></html>
