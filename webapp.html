<style>
:root{--bg:#070a16;--c:#0f1429;--c2:#18203f;--ln:#26305a;--t:#eaf0ff;--m:#8190b8;--up:#2de2c6;--dn:#ff5c8a;--ac:#7b6cff;--y:#ffc46b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(700px 380px at 90% -8%,#2a1f6e 0,transparent 62%),radial-gradient(500px 300px at -10% 30%,#0b3a55 0,transparent 60%),var(--bg);color:var(--t);font:14px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 12px calc(88px + env(safe-area-inset-bottom))}
h1{font:800 21px/1.1 "Trebuchet MS",sans-serif}h1 span{background:linear-gradient(90deg,var(--up),var(--ac));-webkit-background-clip:text;color:transparent}
h2{font-size:14px;margin:16px 0 8px}small,.m{color:var(--m);font-size:12px}
.card{background:linear-gradient(160deg,var(--c),#0c1122);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.num{font-family:ui-monospace,Menlo,monospace}
.btn{border:0;border-radius:13px;padding:12px 14px;font:700 14px "Trebuchet MS",sans-serif;color:#061018;background:linear-gradient(90deg,var(--up),#5ad0ff);width:100%;transition:transform .1s;text-align:center;display:block}
.btn:active{transform:scale(.97)}.btn.s{background:var(--c2);color:var(--t);border:1px solid var(--ln)}.btn.d{background:rgba(255,92,138,.16);color:var(--dn);border:1px solid #5a2440}
input{width:100%;background:var(--c2);border:1px solid var(--ln);color:var(--t);border-radius:12px;padding:11px;font-size:15px;outline:0}
.bar{height:8px;border-radius:9px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--up));transition:width .4s}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}.tag.L{background:rgba(45,226,198,.15);color:var(--up)}.tag.S{background:rgba(255,92,138,.15);color:var(--dn)}
.lv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--ln)}.lv:last-child{border:0}
.sw{width:46px;height:26px;border-radius:99px;background:var(--c2);border:1px solid var(--ln);position:relative;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--m);transition:.2s}
.sw.on{background:rgba(45,226,198,.25)}.sw.on:after{left:22px;background:var(--up)}
.stk{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:6px 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.fb{padding:10px 2px;border-radius:12px;background:var(--c2);border:1px solid var(--ln);color:var(--m);font:700 12.5px "Trebuchet MS",sans-serif;text-align:center;line-height:1.2}
.fb b{display:block;font-size:17px;color:var(--t);font-family:ui-monospace,Menlo,monospace}
.fb.on{background:var(--up);color:#061018;border-color:var(--up)}.fb.on b{color:#061018}.fb:active{transform:scale(.95)}
.sig{display:flex;justify-content:space-between;align-items:center;padding:12px;margin:8px 0;border-radius:14px;background:linear-gradient(160deg,var(--c),#0c1122);border:1px solid var(--ln)}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:var(--c2);color:var(--m);border:1px solid var(--ln)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);margin-right:5px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(7,10,22,.95);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.tb b{flex:1;text-align:center;font-size:10.5px;color:var(--m);padding:5px 0;font-weight:600}.tb b span{display:block;font-size:19px}.tb b.on{color:var(--up)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--c2);border:1px solid var(--ac);padding:9px 16px;border-radius:12px;transition:.25s;z-index:30;max-width:92%;text-align:center}#toast.on{transform:translate(-50%,0)}
.ld{display:grid;place-items:center;height:50vh}.ld i{width:34px;height:34px;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--up);animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
img.ch{width:100%;border-radius:12px;display:block}.lst{cursor:pointer}
.eq{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:8px}.eq i{flex:1;border-radius:2px 2px 0 0;min-height:3px}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}#sheet-bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:.25s;background:var(--c);border-top:1px solid var(--ln);border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));z-index:21}
#sheet.on{transform:translateY(0)}.grab{width:40px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 12px}#sheet h3{font:800 16px "Trebuchet MS",sans-serif}
details summary{cursor:pointer;color:var(--t);font-weight:700;padding:6px 0}

/* IXCLY MAX visual refresh: premium terminal, mobile-first */
:root{--bg:#060914;--c:#0d1426;--c2:#131e35;--ln:rgba(139,164,220,.17);--t:#f2f6ff;--m:#91a0bd;--up:#35e0bd;--dn:#ff668d;--ac:#8b7cff;--y:#ffd078}
html{background:var(--bg);scroll-behavior:smooth}
body{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:radial-gradient(650px 300px at 100% -5%,rgba(107,82,255,.24),transparent 65%),radial-gradient(500px 260px at -15% 18%,rgba(0,191,190,.13),transparent 62%),linear-gradient(180deg,#080d1b 0%,#060914 55%);letter-spacing:.05px}
h1{font-size:25px;letter-spacing:-.8px;margin:4px 0 14px;font-weight:850}
h1 span{background:linear-gradient(100deg,#53ebce 5%,#8c83ff 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:14px;font-weight:800;letter-spacing:.15px;margin:20px 2px 9px}
.card,.sig{background:linear-gradient(145deg,rgba(17,27,49,.97),rgba(10,17,32,.98));border:1px solid var(--ln);border-radius:19px;padding:15px;margin:10px 0;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.card{backdrop-filter:blur(10px)}
.row{gap:10px}.m,small{color:var(--m)}
.btn{min-height:44px;border-radius:14px;background:linear-gradient(105deg,#40e2c2,#67c9f5);box-shadow:0 7px 18px rgba(49,213,194,.12);font-family:inherit;font-weight:800;letter-spacing:.1px}
.btn.s{background:rgba(25,39,66,.9);box-shadow:none;border:1px solid var(--ln);color:#e6edff}
.btn.d{background:rgba(255,91,133,.1);border-color:rgba(255,91,133,.3)}
input{min-height:44px;border-radius:14px;background:#101a30;border-color:rgba(139,164,220,.22);font-family:inherit}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,124,255,.12)}
.pill{border-color:rgba(139,164,220,.18);background:rgba(22,34,57,.9);color:#b6c5e3;padding:5px 9px}
.fb{border-radius:14px;background:rgba(17,29,51,.88);border-color:var(--ln);padding:11px 4px;font-family:inherit}
.fb.on{background:linear-gradient(130deg,#35dfbd,#69c8ef);color:#07131c;border-color:transparent;box-shadow:0 6px 18px rgba(53,224,189,.13)}
.fb b{margin-top:5px;font-size:18px}.stk{position:sticky;top:0;padding:8px 0 7px;background:linear-gradient(#080d1b 72%,rgba(8,13,27,.88));backdrop-filter:blur(12px)}
.sig{padding:14px;border-radius:16px;transition:transform .15s,border-color .15s}.sig:active,.lst:active{transform:scale(.985)}
.lv{border-bottom-color:rgba(139,164,220,.12);padding:9px 0;gap:12px}.bar{height:7px;background:#1b2944}.bar i{border-radius:8px}
.tb{max-width:760px;margin:0 auto;background:rgba(7,12,25,.94);border-top:1px solid rgba(139,164,220,.18);padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px rgba(0,0,0,.25)}
.tb b{font-size:10px;letter-spacing:.1px;border-radius:12px;padding:5px 1px}.tb b span{font-size:20px;margin-bottom:2px}.tb b.on{background:rgba(53,224,189,.09);color:var(--up)}
#toast{background:#17243d;border:1px solid rgba(139,124,255,.5);box-shadow:0 10px 30px #0008;font-weight:700}
#sheet{background:#0d172b;border-color:var(--ln);box-shadow:0 -18px 50px #0008}
/* Large, unmistakable advertising placement — never inside the search field */
.ad-hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:11px;padding:17px;margin:12px 0 16px;border-radius:20px;border:1px solid rgba(139,124,255,.52);background:radial-gradient(260px 140px at 100% 0%,rgba(143,116,255,.32),transparent 72%),linear-gradient(135deg,#182344 0%,#111b35 52%,#102d38 100%);box-shadow:0 12px 32px rgba(49,38,130,.2)}
.ad-hero:after{content:"";position:absolute;width:150px;height:150px;right:-62px;bottom:-90px;border:1px solid rgba(92,232,212,.25);border-radius:50%;box-shadow:0 0 0 18px rgba(92,232,212,.035),0 0 0 38px rgba(92,232,212,.025);pointer-events:none}
.ad-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.ad-label{display:inline-flex;align-items:center;gap:6px;color:#c4baff;background:rgba(139,124,255,.17);border:1px solid rgba(171,157,255,.25);border-radius:99px;padding:5px 9px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.ad-sponsored{font-size:10px;color:#a8b5d2;letter-spacing:.3px}
.ad-copy{position:relative;z-index:1;font-size:15px;line-height:1.45;font-weight:750;color:#f2f5ff;overflow-wrap:anywhere}
.ad-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.ad-foot small{font-size:11px;color:#aebbd7}
.ad-cta{width:auto;min-width:125px;min-height:38px;padding:9px 14px;border-radius:12px;background:linear-gradient(100deg,#a99bff,#64d8d0);color:#091326;font-size:12px;font-weight:900;box-shadow:none}
.ad-hero .ad-icon{font-size:23px;line-height:1}
.search-wrap{display:flex;gap:8px;align-items:center;margin:14px 0 12px;padding:8px;border-radius:17px;background:rgba(15,25,45,.9);border:1px solid var(--ln)}
.search-wrap input{border:0;background:transparent;box-shadow:none;padding:8px 7px;min-width:0}
.search-wrap .btn{width:88px;min-height:40px;padding:8px}
.section-kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8495b9;font-weight:900;margin:16px 2px 7px}
@media(min-width:600px){body{padding-left:20px;padding-right:20px}.ad-hero{padding:20px}.g{gap:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="toast"></div>
<div id="sheet-bg" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><h3 id="sh-title"></h3><small id="sh-sub"></small>
<input id="sh-val" type="text" inputmode="decimal" placeholder="Цена" style="margin-top:10px">
<div class="g" style="margin-top:12px"><button class="btn s" onclick="closeSheet()">Отмена</button><button class="btn" onclick="submitSheet()">Создать алерт</button></div></div>
<div id="v"><div class="ld"><i></i></div></div>
<div class="tb">
<b data-t="signals" onclick="tab('signals')"><span>🔥</span>Сигналы</b>
<b data-t="portfolio" onclick="tab('portfolio')"><span>💼</span>Портфель</b>
<b data-t="analytics" onclick="tab('analytics')"><span>📊</span>Аналитика</b>
<b data-t="sub" onclick="tab('sub')"><span>💎</span>Подписка</b>
<b data-t="more" onclick="tab('more')"><span>⚙️</span>Ещё</b></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#070a16');tg.setBackgroundColor('#070a16')}catch(e){}
const $=s=>document.querySelector(s),V=()=>$('#v');
const hap=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=p=>{if(p==null)return'—';p=+p;const a=Math.abs(p);return a>=1000?p.toLocaleString('en',{maximumFractionDigits:2}):a>=1?p.toFixed(4):a>=.01?p.toFixed(5):p.toFixed(8)};
const pc=(p,e,s='LONG')=>(((s==='SHORT'?-1:1)*(p-e)/e)*100).toFixed(1)+'%';
const side=s=>`<span class="tag ${s=='LONG'?'L':'S'}">${s}</span>`;
const TI={'Краткосрочный':'⚡','Среднесрочный':'⏳','Долгосрочный':'🛡'};
const q=new URLSearchParams(location.search);
const P={};let S={},CUR=null,STACK=[],SF='Все',CUR_COIN=null,PT=null,SHEET_COIN=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
async function api(a,p,tries=2,silent=false){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},p,{initData:tg.initData}))});
      if(r.status>=500) throw new Error('http '+r.status);
      const j=await r.json();
      if(j.error&&!j.closed&&!silent) toast('⚠ '+j.error);
      return j;
    }catch(e){
      if(i===tries-1){if(!silent)toast('Нет связи с сервером');return{error:1,net:1}}
      await new Promise(res=>setTimeout(res,1200));
    }
  }
  return{error:1};
}
function stopPoll(){clearInterval(PT);PT=null}
function stopAll(){stopPoll();closeSheet()}
function setTab(p){const map={coin:'signals',analytics:'analytics',sub:'sub',news:'more',ai_center:'more',paywall:'sub'};const t=map[p]||p;document.querySelectorAll('.tb b').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
async function go(p,a,back){
  if(!back&&CUR)STACK.push(CUR);CUR=[p,a];hap();setTab(p);
  if(STACK.length)tg.BackButton.show();else tg.BackButton.hide();
  if(p!=='coin')stopPoll();scrollTo(0,0);V().innerHTML='<div class="ld"><i></i></div>';
  await P[p](a);
}
function tab(t){stopAll();STACK=[];CUR=null;go(t)}
tg.BackButton.onClick(()=>{const p=STACK.pop();if(p)go(p[0],p[1],true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPoll()});
const botUser=()=>(S.bot||'').replace('@','');
const openBot=cmd=>tg.openTelegramLink(`https://t.me/${botUser()}?start=${cmd}`);
const openSupport=()=>openBot('support');
const shareText=text=>tg.openTelegramLink('https://t.me/share/url?text='+encodeURIComponent(text));
async function refreshMe(){const m=await api('me',{},2,true);if(!m.error||m.closed)S=Object.assign(S,m);return m}

/* --- РЕКЛАМА --- */
let ACTIVE_AD_URL='';
function renderAd(a){
    if(!a || !String(a.ad||'').trim()) return '';
    let safeUrl='';
    try{const u=new URL(String(a.ad_url||''));if(u.protocol==='https:'||u.protocol==='http:')safeUrl=u.href}catch(e){}
    ACTIVE_AD_URL=safeUrl;
    return `<section class="ad-hero" aria-label="Реклама">
      <div class="ad-top"><span class="ad-label"><span class="ad-icon">✦</span> Спецпредложение</span><span class="ad-sponsored">РЕКЛАМА</span></div>
      <div class="ad-copy">${esc(a.ad)}</div>
      <div class="ad-foot"><small>Партнёр IXCLY</small>${safeUrl?'<button class="btn ad-cta" onclick="openAd()">Подробнее&nbsp; ↗</button>':''}</div>
    </section>`;
}
function openAd(){if(!ACTIVE_AD_URL)return;try{tg.openLink(ACTIVE_AD_URL)}catch(e){location.href=ACTIVE_AD_URL}}

/* ---------- Экран оплаты и подписка ---------- */
function planCards(plans){
    return `<div class="g">${plans.map(p=>`
        <div class="card" style="text-align:center; cursor:pointer;" onclick="confirmBuy(${p.days}, ${p.stars})">
            <b>${esc(p.title)}</b>
            <h2 class="num" style="margin:6px 0 2px">${p.stars}⭐</h2>
            <small>${p.days} дн.</small>
        </div>
    `).join('')}</div>`
}
function confirmBuy(days, price) {
    tg.showPopup({
        title: 'Подтверждение оплаты',
        message: `Вы уверены, что хотите оформить подписку на ${days} дней за ${price} ⭐?`,
        buttons: [
            {id: 'cancel', type: 'cancel', text: 'Отмена'},
            {id: 'buy', type: 'default', text: 'Оплатить ⭐'}
        ]
    }, function(buttonId) {
        if (buttonId === 'buy') {
            processPayment(days);
        }
    });
}
async function processPayment(days) {
    tg.showProgress();
    try {
        const res = await fetch('/api/create_stars_invoice', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ days: days, initData: tg.initData })
        });
        const data = await res.json();
        tg.hideProgress();
        if (data.error) { toast('⚠ ' + data.error); return; }
        tg.openInvoice(data.link, function(status) {
            if (status === 'paid') {
                toast('✅ Оплата прошла успешно!');
                setTimeout(() => P.sub(), 1500);
            } else if (status === 'cancelled') { toast('Оплата отменена'); } 
            else { toast('Ошибка оплаты'); }
        });
    } catch (e) {
        tg.hideProgress();
        toast('Ошибка сети');
    }
}
function promoBox(){return `<div class="row" style="margin-top:6px"><input id="pc" placeholder="Промокод" autocapitalize="characters"><button class="btn" style="width:110px" onclick="promoApply()">Активировать</button></div>`}
async function promoApply(){const code=($('#pc').value||'').trim();if(!code)return toast('Введите промокод');const j=await api('promo_apply',{code});if(j.msg){toast(j.msg);const m=await refreshMe();if(!m.closed&&!m.error)go('signals')}}

P.paywall=()=>{const a=S.access||{};
V().innerHTML=`<h1>IXCLY <span>PRO</span></h1>
<div class="card"><b style="font-size:16px">🔒 Доступ закрыт</b><br><small>Пробный период закончился или не активирован. Сигналы, сопровождение сделок и аналитика доступны по подписке.</small></div>
${renderAd(a)}
${planCards(a.plans||[])}
<h2>🎟 Промокод</h2>${promoBox()}
<button class="btn s" style="margin-top:10px" onclick="openSupport()">🆘 Поддержка</button>`};

P.sub=async()=>{await refreshMe();const a=S.access||{};
if(!a.ok&&!a.free){return P.paywall()}
V().innerHTML=`<h1>Моя <span>подписка</span></h1>${a.status==='Навсегда'?'<div class="card" style="text-align:center;border-color:var(--up)"><b>♾ Доступ навсегда</b><br><small>Спасибо за поддержку проекта!</small></div>':''}
<div class="card"><div class="row"><small>Статус</small><b>${esc(a.status)}</b></div>
<div class="row"><small>Осталось</small><b class="num">${a.free?'∞':(a.days_left+' дн.')}</b></div>
${a.free?'':`<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,a.days_left/30*100)}%"></i></div>`}</div>
${renderAd(a)}
<h2>Тарифы</h2>${planCards(a.plans||[])}
<h2>🎟 Промокод</h2>${promoBox()}
<button class="btn s" style="margin-top:10px" onclick="openSupport()">🆘 Поддержка</button>`};

/* ---------- Сигналы ---------- */

return `<div class="sig lst" onclick="go('coin','${x.coin}')"><div style="flex:1"><div class="row" style="justify-content:flex-start;gap:8px"><b>${x.coin}</b>${side(x.side)}<span class="pill">${TI[x.type]||''} ${x.strength||0}%</span>${quality}</div>
